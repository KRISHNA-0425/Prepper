<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f1f2e" />
      <stop offset="60%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#04060a" />
    </radialGradient>
    <linearGradient id="cyberNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00F5A0" />
    </linearGradient>
    <linearGradient id="lineNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38EF7D" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur1" />
      <feGaussianBlur stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="64" fill="url(#bgGlow)" />

  <g filter="url(#neonGlow)">
    <!-- Outer Shield Border -->
    <path d="M 140 80 L 372 80 Q 432 80 432 140 L 432 372 Q 432 432 372 432 L 140 432 Q 80 432 80 372 L 80 140 Q 80 80 140 80 Z" 
          fill="#0a121c" fill-opacity="0.8" stroke="url(#cyberNeon)" stroke-width="14" stroke-linejoin="round" />

    <path d="M 80 135 L 135 80" stroke="url(#cyberNeon)" stroke-width="14" stroke-linecap="round" />
    <path d="M 432 377 L 377 432" stroke="url(#cyberNeon)" stroke-width="14" stroke-linecap="round" />

    <!-- Inner Parallel Line -->
    <path d="M 150 106 L 362 106 Q 406 106 406 150 L 406 362 Q 406 406 362 406 L 150 406 Q 106 406 106 362 L 106 150 Q 106 106 150 106 Z" 
          fill="none" stroke="url(#cyberNeon)" stroke-width="4" stroke-opacity="0.7" stroke-linejoin="round" />

    <!-- P Icon -->
    <path d="M 180 360 L 180 152 L 285 152 C 335 152 355 175 355 218 C 355 260 335 284 285 284 L 242 284 L 242 360" 
          fill="none" stroke="url(#cyberNeon)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <path d="M 212 330 L 212 210 L 270 210 C 295 210 308 215 308 226 C 308 238 295 244 270 244 L 242 244" 
          fill="none" stroke="url(#lineNeon)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />

    <circle cx="212" cy="335" r="8" fill="#00F5A0" />
    <circle cx="212" cy="175" r="8" fill="#00F2FE" />
    <circle cx="275" cy="244" r="7" fill="#00F5A0" />
    <circle cx="180" cy="360" r="10" fill="#00F2FE" />
  </g>
</svg>
